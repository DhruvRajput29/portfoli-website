<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Weather Forecast</h1>
    <div class="input">
        <input type="text" id="city" placeholder="Enter city name" autocomplete="off">

        <div id="suggestions"></div>
    </div>
    <div class="button">
        <button id="submit">Get Weather</button>
    </div>
    <div id="weather-data">
        <p id="city-name"></p>
        <p id="temperature"></p>
        <p id="description"></p>
        <img id="icon" src="" alt="Weather Icon">
    </div>
    <script>
        const apiKey = '6b792dd381526b4e02093ab46826d2e4';
        const cityInput = document.getElementById('city');
        const suggestions =
            document.getElementById('suggestions');

        cityInput.addEventListener('input', async () => {

            const city = cityInput.value.trim();

            if (city.length < 2) {
                suggestions.style.display = "none";
                return;
            }

            const response = await fetch(
                `https://api.openweathermap.org/geo/1.0/direct?q=${city}&limit=5&appid=${apiKey}`
            );

            const data = await response.json();

            suggestions.innerHTML = "";

            if (data.length === 0) {
                suggestions.style.display = "none";
                return;
            }

            data.forEach(place => {

                const div =
                    document.createElement('div');

                div.className =
                    "suggestion-item";

                div.textContent =
                    `${place.name}, ${place.country}`;

                div.onclick = () => {

                    cityInput.value =
                        place.name;

                    suggestions.innerHTML = "";

                    suggestions.style.display =
                        "none";
                };

                suggestions.appendChild(div);
            });

            suggestions.style.display = "block";
        });
        const submitButton = document.getElementById('submit');
        const weatherDataDiv = document.getElementById('weather-data');
        const cityNameElement = document.getElementById('city-name');
        const temperatureElement = document.getElementById('temperature');
        const descriptionElement = document.getElementById('description');
        const iconElement = document.getElementById('icon');

        document.addEventListener('click', e => {

            if (
                !cityInput.contains(e.target)
                &&
                !suggestions.contains(e.target)
            ) {
                suggestions.style.display =
                    "none";
            }
        });
        submitButton.addEventListener('click', (e) => {
            e.preventDefault();
            const city = cityInput.value.trim();
            if (city) {
                fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`)
                    .then(response => response.json())
                    .then(data => {

                        const temperature = data.main.temp;
                        const description = data.weather[0].description;

                        const iconUrl =
                            `https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;

                        cityNameElement.textContent = data.name;

                        temperatureElement.textContent =
                            `${temperature}°C`;

                        descriptionElement.textContent =
                            description;

                        iconElement.src = iconUrl;
                        iconElement.style.backgroundColor = "black";
                        iconElement.style.borderRadius = "50%";
                        weatherDataDiv.style.display = 'flex';
                    })
                    .catch(error => console.error(error));
            }
        });

    </script>
</body>

</html>
